# Put this in your profile repository (github.com/<you>/<you>) as
# .github/workflows/achievements.yml, then add this line to your README:
#
#   ![My GitHub achievements](achievements.svg)
#
name: Update achievements card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: muhammedalikcb/gh-achievements@v0.2.0
        with:
          output: achievements.svg
          # lang: tr
          # theme: dark
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.svg
          git diff --cached --quiet || git commit -m "Update achievements card"
          git push
