name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test installDist
      - name: Smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          build/install/gh-achievements/bin/gh-achievements --version
          build/install/gh-achievements/bin/gh-achievements catalog --no-color > /dev/null
          build/install/gh-achievements/bin/gh-achievements octocat --no-color

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          username: octocat
          output: out/card.svg
      - run: grep -q '<svg' out/card.svg
